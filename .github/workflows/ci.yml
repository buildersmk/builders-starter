name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Dev/test run on SQLite; pg is a production-only gem, so skip that group (no libpq needed).
      BUNDLE_WITHOUT: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # libvips powers Active Storage image variants.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # One entrypoint — the same CI the app defines in config/ci.rb:
      # setup, rubocop, bundler-audit, importmap audit, brakeman, tests, seed replant.
      - name: Run CI
        run: bin/ci
