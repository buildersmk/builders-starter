# Solid Queue polls (no LISTEN/NOTIFY). A 5s interval keeps that polling cheap; drop it lower only
# if you need snappier background jobs.
default: &default
  dispatchers:
    - polling_interval: 5
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
