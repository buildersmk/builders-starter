# Development & test run on SQLite — a plain file on disk, bundled with Rails. Nothing to install,
# nothing to start: clone the repo and `bin/dev` just works. The Solid Cache / Queue / Cable tables
# live in this same database (see db/migrate/*_create_solid_stack_tables.rb).
#
# Production runs on PostgreSQL (a fresh Supabase, or any one Postgres, is all you need). It's tuned
# for the Supabase transaction pooler (PgBouncer, port 6543): prepared_statements off, SSL required,
# and the search_path pinned via a connection variable (never a runtime SET, which the pooler rejects).
# Point it with the discrete DATABASE_* vars (in Doppler or .env) on the server.

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= ENV["DATABASE_HOST"] %>
    port: <%= ENV["DATABASE_PORT"] %>
    database: <%= ENV.fetch("DATABASE_NAME", "postgres") %>
    username: <%= ENV["DATABASE_USERNAME"] %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    sslmode: <%= ENV.fetch("DATABASE_SSLMODE", "require") %>
    # --- Supabase transaction-pooler safety (harmless on a direct connection) ---
    prepared_statements: false
    schema_search_path: public
    variables:
      search_path: public
