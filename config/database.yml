# Development & test run on SQLite — a plain file on disk, bundled with Rails. Nothing to install,
# nothing to start: clone the repo and `bin/dev` just works. Jobs run in-process in development.
#
# Production splits the database in two, on purpose:
#   • primary — PostgreSQL (a fresh Supabase, or any one Postgres). Your BUSINESS data lives here.
#     Tuned for the Supabase transaction pooler: prepared_statements off, SSL required, search_path
#     pinned via a connection variable (never a runtime SET, which the pooler rejects).
#   • queue / cache / cable — SQLite files on the server's own disk volume. This is the PLUMBING:
#     Solid Queue polls forever (no LISTEN/NOTIFY), and against a remote pooled Postgres every poll
#     is a billed, chatty round-trip. So the three throwaway stores live on local SQLite instead —
#     fast, free, and rebuildable. "The database carries the business; the disk carries the plumbing."
#     `timeout` makes a writer wait rather than raise during a Kamal deploy's brief old+new overlap.

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= ENV["DATABASE_HOST"] %>
    port: <%= ENV["DATABASE_PORT"] %>
    database: <%= ENV.fetch("DATABASE_NAME", "postgres") %>
    username: <%= ENV["DATABASE_USERNAME"] %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    sslmode: <%= ENV.fetch("DATABASE_SSLMODE", "require") %>
    # --- Supabase transaction-pooler safety (harmless on a direct connection) ---
    prepared_statements: false
    schema_search_path: public
    variables:
      search_path: public
  queue:
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
    timeout: 5000
  cache:
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
    timeout: 5000
  cable:
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
    timeout: 5000
